<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="appTitle">بازی مین‌روب | Minesweeper</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header>
            <h1 data-i18n="title">مین‌روب</h1>
            <div class="controls">
                <select id="difficulty">
                    <option value="easy" data-i18n="easy">آسان (۹×۹ - ۱۰ مین)</option>
                    <option value="medium" data-i18n="medium">متوسط (۱۶×۱۶ - ۴۰ مین)</option>
                    <option value="hard" data-i18n="hard">سخت (۳۰×۱۶ - ۹۹ مین)</option>
                </select>
                <button id="reset-btn"><i class="fas fa-redo"></i> <span data-i18n="reset">بازی مجدد</span></button>
                <button id="settings-btn" title="تنظیمات" data-i18n-title="settingsTitle"><i class="fas fa-cog"></i></button>
            </div>
            <div class="stats">
                <div class="stat-box">
                    <i class="fas fa-flag text-danger"></i>
                    <span id="mines-count">10</span>
                </div>
                <div class="stat-box">
                    <i class="fas fa-clock text-primary"></i>
                    <span id="timer">0</span>
                </div>
            </div>
        </header>

        <main>
            <div id="board" class="board"></div>
        </main>

        <div id="game-message" class="hidden">
            <h2 id="message-text"></h2>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2 data-i18n="settingsTitle">تنظیمات</h2>

            <div class="setting-item">
                <label data-i18n="theme">پوسته:</label>
                <select id="theme-select">
                    <option value="dark" data-i18n="darkTheme">تاریک</option>
                    <option value="light" data-i18n="lightTheme">روشن</option>
                </select>
            </div>

            <div class="setting-item">
                <label data-i18n="language">زبان:</label>
                <select id="lang-select">
                    <option value="fa">فارسی</option>
                    <option value="en">English</option>
                </select>
            </div>

            <button id="close-settings"><i class="fas fa-times"></i> <span data-i18n="close">بستن</span></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
